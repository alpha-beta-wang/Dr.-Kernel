# Dr.Kernel 默认配置
# 优先级: CLI --key value > 环境变量 > YAML 默认值
# 命令行覆盖: eval $(python3 config/load_config.py rl --train-batch-size 32)
# 环境变量覆盖: export TRAIN_BATCH_SIZE=32 后运行脚本

paths:
  data_root: "/nfs_global/I/${USER}/WangYongsheng/drkernel"

model:
  base_repo: "Qwen/Qwen3-14B-Base"
  eval_repo: "hkust-nlp/drkernel-14b"

# ===== RL 训练参数 =====
rl:
  TRAIN_BATCH_SIZE: 16
  PPO_MINI_BATCH_SIZE: 16
  MAX_PROMPT_LENGTH: 1152
  MAX_RESPONSE_LENGTH: 8192
  ROLLOUT_GPU_MEMORY_UTIL: 0.25
  ROLLOUT_MAX_BATCHED_TOKENS: 1664
  PYTORCH_CUDA_ALLOC_CONF: ""
  ROLLOUT_MODE: "sync"
  ROLLOUT_N: 4
  ALGORITHM: "trloo"
  LEARNING_RATE: 1e-6
  ENABLE_MULTI_TURN: false
  MAX_TURN: 1
  VAL_MAX_TURN: 1
  FREE_CACHE_ENGINE: false
  ACTOR_PARAMETER_OFFLOAD: true
  ACTOR_OPTIMIZER_OFFLOAD: true
  N_VAL: 1
  VAL_BEFORE_TRAIN: false
  ENFORCE_EAGER: true
  PROMPT_OVERSAMPLING_FACTOR: 1.0
  SAMPLE_OVERSAMPLING_FACTOR: 1.0
  REWARD_MANAGER: "kernel_async"
  REWARD_FUNC_NAME: "calculate_reward_speedup"
  NUM_PERF_TRIALS: 100
  IS_GET_LAST_TURN: true
  SP_SIZE: 1
  ROLLOUT_TENSOR_MODEL_PARALLEL_SIZE: 4
  PPO_MICRO_TOKEN: 9344
  LOG_PROB_MICRO_TOKEN: 9344
  RESUME_PATH: null
  RESUME_MODE: auto
  MAX_ACTOR_CKPT_TO_KEEP: 5
  SAVE_FREQ: 1

# ===== Eval 参数（对齐论文 kernel_grading.yaml） =====
# 论文默认: max_prompt_length=20480, max_response_length=8192, num_perf_trials=100
# GPU_MEMORY_UTIL/TENSOR_PARALLEL_SIZE 按 L40S 8卡调优（A100可设 0.9 / 1）
# 多轮eval通过 run_drkernel_eval_multiturn.slurm CLI覆盖 MULTI_TURN/MAX_USER_TURNS
eval:
  N_SAMPLES: 4
  BATCH_SIZE: 32
  ROLLOUT_GPU_MEMORY_UTIL: 0.40
  ROLLOUT_TENSOR_MODEL_PARALLEL_SIZE: 4
  # 多轮对话历史逐轮累积(model output + tool feedback)，3轮轻松超10K token。
  # 设太小(<8192)前轮上下文被截断，模型看不到自己写的代码和反馈→越改越烂。
  # 单轮无所谓但也不会浪费——prompt padding到max_prompt_length不会增加计算量。
  MAX_PROMPT_LENGTH: 20480
  # Qwen3 thinking模型输出结构: 分析推理→代码生成→优化建议。
  # 设太小(4096)导致98.5%样本截断(finish_reason=length)，代码不完整→编译率暴跌。
  MAX_RESPONSE_LENGTH: 8192
  FSDP_SIZE: 8
  MULTI_TURN: false
  MAX_USER_TURNS: 1
  # 论文用100次trials测性能稳定性，10次噪声太大
  NUM_PERF_TRIALS: 100
  NUM_CORRECT_TRIALS: 5
  REWARD_MANAGER: "kernel_async"
  REWARD_FUNC_NAME: "calculate_reward_speedup"
  REWARD_WEIGHTS: "0.3_0.4_0.3"

# ===== Coldstart (SFT) 参数 =====
coldstart:
  TRAIN_BATCH_SIZE: 32
  MICRO_BATCH_SIZE_PER_GPU: 1
  MAX_LENGTH: 12288
  SP_SIZE: 1
  LEARNING_RATE: 2e-5
  TOTAL_EPOCHS: 4
  SAVE_FREQ: 100
  CPU_OFFLOAD: true
  OFFLOAD_PARAMS: true
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,max_split_size_mb:256"

# ===== 集群预设 =====
cluster:
  PARTITION: "r8nv-gpu-hw"
  QOS: "gpu-normal"
  CPUS_PER_TASK: 16
  GPU_MONITOR_INTERVAL: 60
